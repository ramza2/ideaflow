name: P1-12 Verify

on:
  push:
    branches:
      - cursor/modelops-p1-12-adaptive-budget

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -q
          tests/test_adaptive_budget_unit.py
          tests/test_llm_provider_unit.py
          tests/test_modelops_gateway_unit.py
          tests/test_web_research_refine_evidence_unit.py
          tests/test_refine_schema_unit.py

  backend-storage-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ideaflow
          POSTGRES_PASSWORD: ideaflow
          POSTGRES_DB: ideaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideaflow -d ideaflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ideaflow:ideaflow@127.0.0.1:5432/ideaflow_test
      DATABASE_URL: postgresql+psycopg://ideaflow:ideaflow@127.0.0.1:5432/ideaflow_guard
      AI_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prepare dedicated test DB
        env:
          DATABASE_URL: postgresql+psycopg://ideaflow:ideaflow@127.0.0.1:5432/ideaflow_test
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://ideaflow:ideaflow@127.0.0.1:5432/ideaflow_test") as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
          alembic upgrade head
      - name: Storage regression
        run: >-
          pytest -q
          tests/test_ai_session_integration.py::test_worker_success
          tests/test_ai_session_integration.py::test_confirm_and_idempotency
          tests/test_ai_refine_integration.py::test_refine_worker_merges_patch_onto_source_snapshot
          tests/test_ai_refine_integration.py::test_apply_refinement_updates_source_idea_and_is_idempotent
          tests/test_web_research_integration.py::test_research_success_updates_session
          tests/test_web_research_integration.py::test_refine_passes_budgeted_evidence_to_llm
