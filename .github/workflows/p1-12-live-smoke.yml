name: P1-12 Live Smoke

on:
  push:
    branches:
      - cursor/modelops-p1-12-adaptive-budget

jobs:
  live-gateway-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_API_URL: https://modelops-gateway.openlink.kr
      LLM_MODEL_NAME: qwen3-14b
      LLM_CHAT_COMPLETIONS_PATH: /v1/chat/completions
      LLM_ENABLE_THINKING: "false"
      AI_WORKER_ENABLED: "false"
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Exercise IdeaFlow provider against live ModelOps
        run: |
          python - <<'PY'
          import logging
          import uuid

          from app.core.config import Settings
          from app.llm.openai_compatible import OpenAICompatibleLlmProvider
          from app.llm.refine_schemas import IdeaRefinementRequest
          from app.llm.research_schemas import (
              EvidenceInput,
              EvidenceRefinementRequest,
              validate_refinement_result,
          )
          from app.llm.schemas import IdeaStructuringRequest
          from app.models.enums import IdeaRefineDirection

          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")

          settings = Settings(_env_file=None)
          provider = OpenAICompatibleLlmProvider(settings)
          try:
              structure = provider.structure_idea(
                  IdeaStructuringRequest(
                      input_text=(
                          "사내 아이디어를 자연어로 등록하면 관련 웹 조사 근거를 찾아 "
                          "초안을 보완하고 검토 가능한 형태로 정리하는 기능"
                      )
                  )
              )
              print(
                  "SMOKE STRUCTURE PASS",
                  "decision=" + structure.decision.value,
                  "title_present=" + str(bool(structure.draft.title)),
              )

              refine = provider.refine_idea(
                  IdeaRefinementRequest(
                      direction=IdeaRefineDirection.TECHNICAL_IMPLEMENTATION,
                      source_context={
                          "title": "아이디어 조사 보완 기능",
                          "one_line_definition": "웹 근거로 아이디어 초안을 보완한다.",
                          "background": "기존 등록 초안에 시장/기술 근거가 부족할 수 있다.",
                          "core_concept": "검색 근거를 수집하고 LLM이 근거 기반으로 초안을 보완한다.",
                      },
                  )
              )
              print(
                  "SMOKE REFINE PASS",
                  "decision=" + refine.decision.value,
                  "patch_fields=" + str(len(refine.draft_patch or {})),
              )

              evidence_id = uuid.uuid4()
              research_request = EvidenceRefinementRequest(
                  input_text="synthetic smoke input",
                  base_draft={
                      "title": "아이디어 조사 보완 기능",
                      "background": "기존 등록 초안에 외부 근거가 부족하다.",
                      "problem": "검토자가 시장/기술 현황을 별도로 찾아야 한다.",
                  },
                  base_provenance={},
                  user_edited_fields=[],
                  evidence=[
                      EvidenceInput(
                          evidence_id=evidence_id,
                          title="Synthetic evidence for integration smoke",
                          source="ModelOps live smoke",
                          published_at="2026-10-19",
                          snippet=(
                              "웹 조사 근거를 구조화해 초안의 배경과 문제 정의를 보완하고, "
                              "변경된 필드는 사용한 근거 식별자와 연결해야 한다."
                          ),
                      )
                  ],
              )
              research = provider.refine_idea_with_evidence(research_request)
              valid_ids = {str(ev.evidence_id) for ev in research_request.evidence}
              validate_refinement_result(
                  research,
                  base_draft=research_request.base_draft,
                  user_edited_fields=research_request.user_edited_fields,
                  valid_evidence_ids=valid_ids,
              )
              returned_ids = {
                  eid
                  for ids in research.evidence_links.values()
                  for eid in ids
              }
              if not returned_ids.issubset(valid_ids):
                  raise AssertionError("research returned an evidence id not sent to the LLM")
              print(
                  "SMOKE WEB_RESEARCH PASS",
                  "evidence_sent=" + str(len(research_request.evidence)),
                  "evidence_link_ids=" + str(len(returned_ids)),
              )
          finally:
              provider.close()
          PY
