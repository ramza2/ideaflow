name: Feasibility Drift Verify

on:
  push:
    branches:
      - cursor/refine-feasibility-enum-prompt

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_refine_schema_unit.py

  live-technical-refine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_API_URL: https://modelops-gateway.openlink.kr
      LLM_MODEL_NAME: qwen3-14b
      LLM_CHAT_COMPLETIONS_PATH: /v1/chat/completions
      LLM_ENABLE_THINKING: "false"
      AI_WORKER_ENABLED: "false"
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Technical implementation refine smoke
        run: |
          python - <<'PY'
          from app.core.config import Settings
          from app.llm.openai_compatible import OpenAICompatibleLlmProvider
          from app.llm.refine_schemas import IdeaRefinementRequest
          from app.models.enums import IdeaRefineDirection

          provider = OpenAICompatibleLlmProvider(Settings(_env_file=None))
          try:
              result = provider.refine_idea(
                  IdeaRefinementRequest(
                      direction=IdeaRefineDirection.TECHNICAL_IMPLEMENTATION,
                      source_context={
                          "title": "아이디어 조사 보완 기능",
                          "one_line_definition": "웹 근거로 아이디어 초안을 보완한다.",
                          "background": "기존 등록 초안에 시장 및 기술 근거가 부족할 수 있다.",
                          "core_concept": "검색 근거를 수집하고 LLM이 근거 기반으로 초안을 보완한다.",
                          "feasibility": "UNKNOWN",
                      },
                  )
              )
              feasibility = result.draft_patch.get("feasibility")
              if feasibility is not None:
                  value = feasibility.value if hasattr(feasibility, "value") else str(feasibility)
                  if value not in {"HIGH", "MEDIUM", "LOW", "UNKNOWN"}:
                      raise AssertionError(f"unexpected feasibility enum: {value}")
              print(
                  "SMOKE TECHNICAL_IMPLEMENTATION PASS",
                  "decision=" + result.decision.value,
                  "feasibility_present=" + str(feasibility is not None),
                  "patch_fields=" + str(len(result.draft_patch or {})),
              )
          finally:
              provider.close()
          PY
